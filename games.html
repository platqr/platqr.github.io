<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>games · platqr (・_・)ノ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />

    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>

  <body data-page="games">
    <main class="page">
      <nav class="nav" id="nav"></nav>

      <div class="list-toggle" id="sort"></div>

      <section>
        <div class="page-head">
          <h2 class="sec">now playing</h2>
          <span class="range" id="count-playing"></span>
        </div>
        <div class="game-grid" id="games-playing"></div>
      </section>

      <section>
        <div class="page-head">
          <h2 class="sec">backlog</h2>
          <span class="range" id="count-backlog"></span>
        </div>
        <div class="game-grid" id="games-backlog"></div>
      </section>

      <section>
        <div class="page-head">
          <h2 class="sec">finished</h2>
          <span class="range" id="count-finished"></span>
        </div>
        <div class="game-grid" id="games-finished"></div>
      </section>

    </main>

    <script src="./data/games.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
