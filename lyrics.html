<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Lyrics - platqr</title>

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./pages.css" />

    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>

  <body data-page="lyrics">
    <main class="page">
      <nav class="nav" id="nav"></nav>

      <div class="list-toggle" id="song-toggle"></div>

      <div class="page-head">
        <h2 class="sec" id="song-title"></h2>
        <span class="range" id="count"></span>
      </div>

      <div class="lyrics" id="lyrics"></div>
    </main>

    <script src="./hidden.js"></script>
    <script src="./data/lyrics.js"></script>
    <script src="./app.js"></script>
    <script src="./lyrics.js"></script>
  </body>
</html>
